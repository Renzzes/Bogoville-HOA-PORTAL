<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bogoville HOA – WiFi Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet" />

  <style>
    /* ── Design tokens (HOA green palette) ── */
    :root {
      --green:        #1a8c3e;
      --green-dark:   #126b2e;
      --green-light:  #2db558;
      --green-dim:    rgba(26,140,62,0.25);
      --orange:       #e8a020;
      --orange-light: #f0bc55;
      --orange-dim:   rgba(232,160,32,0.3);
      --bg:           #f5f2ec;        /* dirty white */
      --card-bg:      rgba(255,255,255,0.82);
      --card-border:  rgba(26,140,62,0.18);
      --shadow:       0 24px 64px rgba(26,140,62,0.13), 0 4px 16px rgba(0,0,0,0.08);
      --radius:       22px;
      --transition:   0.32s cubic-bezier(0.4,0,0.2,1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'Nunito', sans-serif;
      overflow-x: hidden;
    }

    /* ── Background: dirty white with floating bubbles ── */
    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: radial-gradient(circle at top, rgba(45,181,88,0.11), transparent 28%),
                  radial-gradient(circle at 20% 90%, rgba(232,160,32,0.08), transparent 22%),
                  var(--bg);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 0;
      position: relative;
    }

    .page-shell {
      width: min(100%, 1180px);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: env(safe-area-inset-top, 16px) 14px env(safe-area-inset-bottom, 18px);
      gap: 18px;
      z-index: 10;
    }

    /* top green accent bar */
    body::after {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--green-dark), var(--green-light), var(--orange), var(--green-light), var(--green-dark));
      background-size: 200% 100%;
      animation: shimmer 4s linear infinite;
      z-index: 100;
    }

    @keyframes shimmer {
      0%   { background-position: 0% 0; }
      100% { background-position: 200% 0; }
    }

    /* ── Floating bubble canvas layer ── */
    #bubbleCanvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Portal card ── */
    .portal-card {
      position: relative;
      z-index: 10;
      width: min(100%, 100vw);
      max-width: 100%;
      min-height: calc(100dvh - 140px);
      background: var(--card-bg);
      backdrop-filter: blur(20px) saturate(1.4);
      -webkit-backdrop-filter: blur(20px) saturate(1.4);
      border: 1.5px solid var(--card-border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 30px 18px 28px;
      text-align: center;
      animation: cardReveal 0.85s cubic-bezier(0.22,1,0.36,1) both;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    @keyframes cardReveal {
      from { opacity: 0; transform: translateY(28px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0)   scale(1);    }
    }

    /* ── Clock ── */
    .clock-wrap {
      margin-bottom: 16px;
      animation: fadeDown 0.7s 0.05s cubic-bezier(0.22,1,0.36,1) both;
    }

    .clock-time {
      font-size: 2.6rem;
      font-weight: 800;
      color: var(--green-dark);
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .clock-day {
      font-size: 1rem;
      font-weight: 600;
      color: var(--green);
      margin-top: 4px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .clock-date {
      font-size: 0.95rem;
      font-weight: 400;
      color: #7a8a7e;
      margin-top: 2px;
    }

    /* ── Logo ── */
    .logo-wrap {
      margin-bottom: 20px;
      animation: fadeDown 0.7s 0.1s cubic-bezier(0.22,1,0.36,1) both;
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-18px); }
      to   { opacity: 1; transform: translateY(0);     }
    }

    .logo-wrap img {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 50%;
      display: block;
      margin: 0 auto;
    }

    /* ── Org badge ── */
    .org-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: linear-gradient(135deg, var(--green-dark), var(--green));
      color: #fff;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 5px 14px;
      border-radius: 999px;
      margin: 0 auto 20px;
      animation: fadeIn 0.6s 0.3s both;
    }


    /* ── Typography ── */
    .heading {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.5rem, 5vw, 2rem);
      font-weight: 700;
      line-height: 1.2;
      color: var(--green-dark);
      margin-bottom: 14px;
      animation: fadeIn 0.6s 0.45s both;
    }

    .success-msg {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--green);
      margin-bottom: 6px;
      letter-spacing: 0.01em;
      animation: fadeIn 0.6s 0.5s both;
    }

    .subtitle {
      font-size: 0.8rem;
      font-weight: 400;
      color: #7a8a7e;
      letter-spacing: 0.01em;
      margin-bottom: 28px;
      animation: fadeIn 0.6s 0.55s both;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0);   }
    }

    /* ── Divider ── */
    .divider {
      height: 1.5px;
      background: linear-gradient(90deg, transparent, var(--green-dim), var(--orange-dim), var(--green-dim), transparent);
      margin: 0 0 24px;
      animation: fadeIn 0.6s 0.6s both;
    }

    /* ── CTA Button — stays inside card ── */
    .btn-continue {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;           /* fills card width only */
      padding: 14px 20px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      color: #fff;
      background: linear-gradient(135deg, var(--green-light), var(--green-dark));
      box-shadow: 0 4px 20px rgba(26,140,62,0.35);
      transition: var(--transition);
      animation: fadeIn 0.6s 0.7s both;
      position: relative;
      overflow: hidden;
    }

    .btn-continue::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.18), transparent);
      opacity: 0;
      transition: var(--transition);
    }

    .btn-continue:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(26,140,62,0.45); }
    .btn-continue:hover::before { opacity: 1; }
    .btn-continue:active { transform: translateY(0); }

    .btn-continue svg {
      width: 18px; height: 18px; flex-shrink: 0;
    }

    /* ── WiFi badge ── */
    .wifi-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin: 20px auto 0;
      padding: 6px 14px;
      border-radius: 999px;
      border: 1.5px solid var(--green-dim);
      background: rgba(26,140,62,0.06);
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--green-dark);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      animation: fadeIn 0.6s 0.8s both;
    }

    .wifi-badge svg {
      width: 13px; height: 13px;
      stroke: var(--green);
    }

    /* ── Footer ── */
    .footer {
      position: relative;
      z-index: 10;
      width: min(100%, 720px);
      margin-top: 24px;
      font-size: 0.75rem;
      color: #a0a89e;
      letter-spacing: 0.05em;
      text-align: center;
      animation: fadeIn 0.6s 0.95s both;
      padding-bottom: env(safe-area-inset-bottom, 10px);
    }

    .footer-line,
    .footer-org {
      display: block;
      line-height: 1.4;
    }

    .footer-org {
      margin-top: 6px;
      color: var(--green-dark);
      font-weight: 600;
    }

    /* ── Responsive ── */
    @media (min-width: 480px) {
      .page-shell {
        padding: env(safe-area-inset-top, 24px) 24px env(safe-area-inset-bottom, 24px);
      }
      .portal-card {
        max-width: 520px;
        min-height: auto;
        padding: 42px 34px 36px;
        border-radius: 28px;
      }
      .logo-wrap img {
        width: 190px;
        height: 190px;
      }
      .footer {
        font-size: 0.78rem;
      }
    }
    @media (min-width: 768px) {
      body {
        padding: 32px;
      }
      .page-shell {
        padding: 42px 32px 42px;
        justify-content: space-between;
      }
      .portal-card {
        max-width: 620px;
        padding: 48px 44px 44px;
        border-radius: 32px;
      }
      .logo-wrap img {
        width: 200px;
        height: 200px;
      }
    }
    @media (min-width: 1100px) {
      .page-shell {
        padding: 50px 36px 50px;
      }
      .portal-card {
        max-width: 680px;
      }
    }
  </style>
</head>

    ];

    let bubbles = [];

    function resize() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function createBubble() {
      const r = 30 + Math.random() * 80;
      return {
        x:     Math.random() * canvas.width,
        y:     canvas.height + r,
        r,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        speed: 0.3 + Math.random() * 0.7,
        drift: (Math.random() - 0.5) * 0.4,
        wobble: Math.random() * Math.PI * 2,
        wobbleSpeed: 0.008 + Math.random() * 0.012,
        opacity: 0.5 + Math.random() * 0.5,
      };
    }

    function init() {
      resize();
      bubbles = [];
      // seed initial bubbles spread across the screen
      for (let i = 0; i < 18; i++) {
        const b = createBubble();
        b.y = Math.random() * canvas.height;
        bubbles.push(b);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      bubbles.forEach(b => {
        b.y -= b.speed;
        b.wobble += b.wobbleSpeed;
        const wx = Math.sin(b.wobble) * 1.5;

        ctx.beginPath();
        ctx.arc(b.x + wx, b.y, b.r, 0, Math.PI * 2);
        ctx.fillStyle = b.color;
        ctx.fill();

        // subtle rim highlight
        ctx.beginPath();
        ctx.arc(b.x + wx - b.r * 0.25, b.y - b.r * 0.25, b.r * 0.35, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.12)';
        ctx.fill();

        // respawn when off-screen top
        if (b.y + b.r < 0) {
          const nb = createBubble();
          nb.x = Math.random() * canvas.width;
          Object.assign(b, nb);
        }
      });

      requestAnimationFrame(draw);
    }

    window.addEventListener('resize', () => { resize(); });
    init();
    draw();

    /* ── Button redirect ── */
    document.getElementById('btnContinue').addEventListener('click', () => {
      window.location.href = 'https://www.google.com';
    });

    /* ── Real-time Clock ── */
    function updateClock() {
      const now  = new Date();
      const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];

      let h = now.getHours();
      const ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12 || 12;
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');

      document.getElementById('clockTime').textContent = `${h}:${m}:${s} ${ampm}`;
      document.getElementById('clockDay').textContent  = days[now.getDay()];
      document.getElementById('clockDate').textContent = `${months[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()}`;
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
